name: Portfolio Quality & Health Check

# Triggers whenever you push code or open a Pull Request
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-check:
    runs-on: ubuntu-latest

    steps:
      # 1. Downloads a copy of your repo to the temporary cloud VM
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Verifies that your index.html file actually exists
      - name: Check HTML File Presence
        run: |
          if [ -f "index.html" ]; then
            echo "SUCCESS: index.html is present and accounted for."
          else
            echo "ERROR: index.html missing from root directory!"
            exit 1
          fi

      # 3. Simple HTML syntax/tag integrity check
      - name: Validate HTML Structure
        run: |
          echo "Scanning index.html for basic structural closing tags..."
          grep -i "</html>" index.html || (echo "ERROR: Missing </html> tag" && exit 1)
          echo "HTML structure scan passed successfully."
